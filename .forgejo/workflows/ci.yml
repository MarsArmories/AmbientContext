name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build and test
    runs-on: docker
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore
        run: dotnet restore AmbientContext.slnx

      - name: Build
        run: dotnet build AmbientContext.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AmbientContext.slnx --configuration Release --no-build
