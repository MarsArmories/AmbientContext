name: Continuous Integration
run-name: CI for ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build and test
    runs-on: docker
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore
        run: |
          echo "==> Restoring AmbientContext"
          dotnet restore AmbientContext.slnx

      - name: Build
        run: |
          echo "==> Building AmbientContext"
          dotnet build AmbientContext.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: |
          echo "==> Testing AmbientContext with coverage"
          mkdir -p artifacts/test-results
          dotnet test AmbientContext.slnx --configuration Release --no-build --coverage --coverage-output artifacts/test-results/coverage.cobertura.xml --coverage-output-format cobertura
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## AmbientContext CI"
              echo
              echo "| Check | Result |"
              echo "| --- | --- |"
              echo "| Restore | complete |"
              echo "| Build | complete |"
              echo "| Tests | complete |"
              echo "| Coverage | written under each test assembly TestResults folder |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
