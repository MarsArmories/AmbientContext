name: Publish Packages
run-name: Publish packages from ${{ forgejo.event.inputs.release_tag || forgejo.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

concurrency:
  group: forgejo-packages-${{ forgejo.event.inputs.release_tag || forgejo.ref_name }}
  cancel-in-progress: false

jobs:
  publish-forgejo:
    name: Publish to Forgejo Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ forgejo.event.inputs.release_tag || forgejo.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve package version from tag
        env:
          FORGEJO_EVENT_NAME: ${{ forgejo.event_name }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
          RELEASE_REF_TYPE: ${{ forgejo.ref_type }}
          REQUESTED_RELEASE_TAG: ${{ forgejo.event.inputs.release_tag }}
        run: |
          set -eu
          if [ "$FORGEJO_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$REQUESTED_RELEASE_TAG"
          elif [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "Package publication requires a tag."
            exit 1
          fi

          package_version="${RELEASE_TAG#v}"
          if ! printf '%s' "$package_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "Tag '$RELEASE_TAG' is not a supported SemVer release tag."
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "==> Publishing package version: $package_version"

      - name: Restore
        run: |
          echo "==> Restoring AmbientContext"
          dotnet restore AmbientContext.slnx

      - name: Build
        run: |
          echo "==> Building AmbientContext"
          dotnet build AmbientContext.slnx --configuration Release --no-restore -p:Version="$PACKAGE_VERSION" -p:InformationalVersion="$PACKAGE_VERSION"

      - name: Test with coverage
        run: |
          echo "==> Testing AmbientContext with coverage"
          mkdir -p artifacts/test-results
          dotnet test AmbientContext.slnx --configuration Release --no-build --coverage --coverage-output artifacts/test-results/coverage.cobertura.xml --coverage-output-format cobertura

      - name: Pack
        run: |
          echo "==> Packing AmbientContext"
          dotnet pack src/AmbientContext.Core/AmbientContext.Core.csproj --configuration Release --no-build --output artifacts/package/release -p:Version="$PACKAGE_VERSION"
          dotnet pack src/AmbientContext.Analyzers/AmbientContext.Analyzers.csproj --configuration Release --no-build --output artifacts/package/release -p:Version="$PACKAGE_VERSION"

      - name: Validate package artifacts
        run: |
          set -eu
          test -f "artifacts/package/release/MarsArmories.AmbientContext.${PACKAGE_VERSION}.nupkg"
          test -f "artifacts/package/release/MarsArmories.AmbientContext.Analyzers.${PACKAGE_VERSION}.nupkg"

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.ORG_PACKAGE_TOKEN }}
          FORGEJO_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          : "${NUGET_API_KEY:?Configure the ORG_PACKAGE_TOKEN Actions secret with a personal access token scoped to write:package.}"
          source_url="https://code.vox9.net/api/packages/${FORGEJO_REPOSITORY_OWNER}/nuget/index.json"

          for package in artifacts/package/release/*.nupkg; do
            dotnet nuget push "$package" --source "$source_url" --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate
          done

          for symbols in artifacts/package/release/*.snupkg; do
            [ -e "$symbols" ] || continue
            dotnet nuget push "$symbols" --source "$source_url" --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Prepare release notes
        run: |
          set -euo pipefail
          awk -v version="$PACKAGE_VERSION" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
              found = 1
              next
            }
            found && /^## \[/ {
              exit
            }
            found {
              print
            }
            END {
              if (!found) {
                exit 1
              }
            }
          ' CHANGELOG.md > artifacts/release-notes.md
          sed -i '/./,$!d' artifacts/release-notes.md
          test -s artifacts/release-notes.md

      - name: Create Forgejo release
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          releases_url="${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/releases"
          existing_status="$(
            curl --silent --show-error \
              --output artifacts/existing-release.json \
              --write-out '%{http_code}' \
              --header "Authorization: token ${FORGEJO_TOKEN}" \
              "${releases_url}/tags/${RELEASE_TAG}"
          )"

          if [ "$existing_status" = "200" ]; then
            echo "Forgejo release '$RELEASE_TAG' already exists."
            exit 0
          fi

          if [ "$existing_status" != "404" ]; then
            echo "Unable to check Forgejo release '$RELEASE_TAG' (HTTP $existing_status)."
            exit 1
          fi

          export RELEASE_PRERELEASE=false
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            export RELEASE_PRERELEASE=true
          fi

          node <<'NODE' > artifacts/release.json
          const fs = require("fs");

          process.stdout.write(JSON.stringify({
            tag_name: process.env.RELEASE_TAG,
            target_commitish: process.env.RELEASE_TAG,
            name: process.env.RELEASE_TAG,
            body: fs.readFileSync("artifacts/release-notes.md", "utf8"),
            draft: false,
            prerelease: process.env.RELEASE_PRERELEASE === "true"
          }));
          NODE

          create_status="$(
            curl --silent --show-error \
              --output artifacts/created-release.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: token ${FORGEJO_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary @artifacts/release.json \
              "$releases_url"
          )"

          if [ "$create_status" != "201" ]; then
            echo "Unable to create Forgejo release '$RELEASE_TAG' (HTTP $create_status)."
            exit 1
          fi

          echo "Created Forgejo release '$RELEASE_TAG'."

      - name: Publish summary
        if: always()
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## AmbientContext Package Publish"
              echo
              echo "| Check | Result |"
              echo "| --- | --- |"
              echo "| Build | complete |"
              echo "| Tests | complete |"
              echo "| Coverage | written under each test assembly TestResults folder |"
              echo "| Packages | pushed to Forgejo registry |"
              echo "| Release | created or already present for \`$RELEASE_TAG\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
