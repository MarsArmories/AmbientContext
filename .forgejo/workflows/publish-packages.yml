name: Publish Packages
run-name: Publish packages from ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-forgejo:
    name: Publish to Forgejo Packages
    runs-on: docker
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore
        run: |
          echo "==> Restoring AmbientContext"
          dotnet restore AmbientContext.slnx

      - name: Build
        run: |
          echo "==> Building AmbientContext"
          dotnet build AmbientContext.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: |
          echo "==> Testing AmbientContext with coverage"
          mkdir -p artifacts/test-results
          dotnet test AmbientContext.slnx --configuration Release --no-build --coverage --coverage-output artifacts/test-results/coverage.cobertura.xml --coverage-output-format cobertura

      - name: Pack
        run: |
          echo "==> Packing AmbientContext"
          dotnet pack AmbientContext.slnx --configuration Release --no-build --output artifacts/package/release

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          source_url="${FORGEJO_SERVER_URL}/api/packages/${FORGEJO_REPOSITORY_OWNER}/nuget/index.json"

          for package in artifacts/package/release/*.nupkg; do
            dotnet nuget push "$package" --source "$source_url" --api-key "$NUGET_API_KEY" --skip-duplicate --no-symbols
          done

          for symbols in artifacts/package/release/*.snupkg; do
            [ -e "$symbols" ] || continue
            dotnet nuget push "$symbols" --source "$source_url" --api-key "$NUGET_API_KEY" --skip-duplicate
          done

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## AmbientContext Package Publish"
              echo
              echo "| Check | Result |"
              echo "| --- | --- |"
              echo "| Build | complete |"
              echo "| Tests | complete |"
              echo "| Coverage | written under each test assembly TestResults folder |"
              echo "| Packages | pushed to Forgejo registry |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
