name: Continuous Integration
run-name: CI for ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Define pull request prerelease version
        if: github.event_name == 'pull_request'
        id: prerelease
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          suffix="pr.${PR_NUMBER}.${short_sha}"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Packing prerelease version suffix: $suffix"

      - name: Restore
        run: |
          echo "::group::Restore"
          dotnet restore AmbientContext.slnx
          echo "::endgroup::"

      - name: Build
        run: |
          echo "::group::Build"
          dotnet build AmbientContext.slnx --configuration Release --no-restore -p:VersionSuffix="${{ steps.prerelease.outputs.suffix }}"
          echo "::endgroup::"

      - name: Test with coverage
        run: |
          echo "::group::Test with coverage"
          mkdir -p artifacts/test-results
          dotnet test AmbientContext.slnx --configuration Release --no-build --coverage --coverage-output artifacts/test-results/coverage.cobertura.xml --coverage-output-format cobertura
          echo "::endgroup::"

      - name: Pack pull request prerelease artifacts
        if: github.event_name == 'pull_request'
        run: |
          echo "::group::Pack pull request prerelease artifacts"
          dotnet pack AmbientContext.slnx --configuration Release --no-build --output artifacts/package/prerelease --version-suffix "${{ steps.prerelease.outputs.suffix }}"
          echo "::endgroup::"

      - name: Upload pull request prerelease artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-packages-pr-${{ github.event.pull_request.number }}
          retention-days: 7
          path: |
            artifacts/package/prerelease/*.nupkg
            artifacts/package/prerelease/*.snupkg

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/bin/**/TestResults/artifacts/test-results/coverage.cobertura.xml

      - name: Build summary
        if: always()
        run: |
          {
            echo "## AmbientContext CI"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Restore | complete |"
            echo "| Build | complete |"
            echo "| Tests | complete |"
            echo "| Coverage | Cobertura files uploaded as artifact \`coverage\` |"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "| PR packages | prerelease artifacts uploaded without registry publication |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
