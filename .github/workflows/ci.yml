name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AmbientContext.slnx

      - name: Build
        run: dotnet build AmbientContext.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AmbientContext.slnx --configuration Release --no-build
