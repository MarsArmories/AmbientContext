name: Publish to NuGet.org
run-name: Publish NuGet.org packages from ${{ github.event.inputs.tag || github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.1.0 or v0.2.0-rc.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NOLOGO: true

concurrency:
  group: nuget-org-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-nuget-org:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    environment: nuget.org
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve package version from tag
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          REQUESTED_RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$REQUESTED_RELEASE_TAG"
          elif [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Package publication requires a tag."
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            echo "::error::Tag '$RELEASE_TAG' does not exist."
            exit 1
          fi

          package_version="${RELEASE_TAG#v}"
          if ! printf '%s' "$package_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Tag '$RELEASE_TAG' is not a supported SemVer release tag."
            exit 1
          fi

          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "Publishing package version: $package_version"

      - name: Restore
        run: |
          echo "::group::Restore"
          dotnet restore AmbientContext.slnx
          echo "::endgroup::"

      - name: Build
        run: |
          echo "::group::Build"
          dotnet build AmbientContext.slnx --configuration Release --no-restore -p:Version="$PACKAGE_VERSION" -p:InformationalVersion="$PACKAGE_VERSION"
          echo "::endgroup::"

      - name: Test with coverage
        run: |
          echo "::group::Test with coverage"
          mkdir -p artifacts/test-results
          dotnet test AmbientContext.slnx --configuration Release --no-build --coverage --coverage-output artifacts/test-results/coverage.cobertura.xml --coverage-output-format cobertura
          echo "::endgroup::"

      - name: Pack
        run: |
          echo "::group::Pack"
          dotnet pack AmbientContext.slnx --configuration Release --no-build --output artifacts/package/release -p:Version="$PACKAGE_VERSION"
          echo "::endgroup::"

      - name: Validate package artifacts
        run: |
          set -euo pipefail
          test -f "artifacts/package/release/MarsArmories.AmbientContext.${PACKAGE_VERSION}.nupkg"
          test -f "artifacts/package/release/MarsArmories.AmbientContext.Analyzers.${PACKAGE_VERSION}.nupkg"

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in artifacts/package/release/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-org-packages
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/bin/**/TestResults/artifacts/test-results/coverage.cobertura.xml

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## AmbientContext NuGet.org Publish"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Build | complete |"
            echo "| Tests | complete |"
            echo "| Coverage | Cobertura files uploaded as artifact \`coverage\` |"
            echo "| Packages | pushed to NuGet.org |"
          } >> "$GITHUB_STEP_SUMMARY"
