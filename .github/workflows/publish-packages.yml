name: Publish Packages
run-name: Publish packages from ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true

concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve package version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "::error::Package publication requires a tag."
            exit 1
          fi

          package_version="${RELEASE_TAG#v}"
          if ! printf '%s' "$package_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::Tag '$RELEASE_TAG' is not a supported SemVer release tag."
            exit 1
          fi

          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "Publishing package version: $package_version"

      - name: Restore
        run: |
          echo "::group::Restore"
          dotnet restore AmbientContext.slnx
          echo "::endgroup::"

      - name: Build
        run: |
          echo "::group::Build"
          dotnet build AmbientContext.slnx --configuration Release --no-restore -p:Version="$PACKAGE_VERSION" -p:InformationalVersion="$PACKAGE_VERSION"
          echo "::endgroup::"

      - name: Test with coverage
        run: |
          echo "::group::Test with coverage"
          mkdir -p artifacts/test-results
          dotnet test AmbientContext.slnx --configuration Release --no-build --coverage --coverage-output artifacts/test-results/coverage.cobertura.xml --coverage-output-format cobertura
          echo "::endgroup::"

      - name: Pack
        run: |
          echo "::group::Pack"
          dotnet pack AmbientContext.slnx --configuration Release --no-build --output artifacts/package/release -p:Version="$PACKAGE_VERSION"
          echo "::endgroup::"

      - name: Validate package artifacts
        run: |
          set -euo pipefail
          test -f "artifacts/package/release/MarsArmories.AmbientContext.${PACKAGE_VERSION}.nupkg"
          test -f "artifacts/package/release/MarsArmories.AmbientContext.Analyzers.${PACKAGE_VERSION}.nupkg"

      - name: Publish packages
        env:
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in artifacts/package/release/*.nupkg; do
            dotnet nuget push "$package" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --no-symbols
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/bin/**/TestResults/artifacts/test-results/coverage.cobertura.xml

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## AmbientContext Package Publish"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Build | complete |"
            echo "| Tests | complete |"
            echo "| Coverage | Cobertura files uploaded as artifact \`coverage\` |"
            echo "| Packages | uploaded as artifact \`nuget-packages\` |"
          } >> "$GITHUB_STEP_SUMMARY"
