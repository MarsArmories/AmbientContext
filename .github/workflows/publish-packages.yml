name: Publish Packages
run-name: Publish packages from ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true

jobs:
  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          echo "::group::Restore"
          dotnet restore AmbientContext.slnx
          echo "::endgroup::"

      - name: Build
        run: |
          echo "::group::Build"
          dotnet build AmbientContext.slnx --configuration Release --no-restore
          echo "::endgroup::"

      - name: Test with coverage
        run: |
          echo "::group::Test with coverage"
          mkdir -p artifacts/test-results
          dotnet test AmbientContext.slnx --configuration Release --no-build --coverage --coverage-output artifacts/test-results/coverage.cobertura.xml --coverage-output-format cobertura
          echo "::endgroup::"

      - name: Pack
        run: |
          echo "::group::Pack"
          dotnet pack AmbientContext.slnx --configuration Release --no-build --output artifacts/package/release
          echo "::endgroup::"

      - name: Publish packages
        env:
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in artifacts/package/release/*.nupkg; do
            dotnet nuget push "$package" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate --no-symbols
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/bin/**/TestResults/artifacts/test-results/coverage.cobertura.xml

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## AmbientContext Package Publish"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Build | complete |"
            echo "| Tests | complete |"
            echo "| Coverage | Cobertura files uploaded as artifact \`coverage\` |"
            echo "| Packages | uploaded as artifact \`nuget-packages\` |"
          } >> "$GITHUB_STEP_SUMMARY"
